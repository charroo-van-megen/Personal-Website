<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <nav class="navbar">
    <div class="logo">
      <a href="index.html">Charroo van Megen</a>
    </div>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="projects.html">Projects</a>
      <a href="about.html">About Me</a>
      <a href="Personal.html">Hobbies</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </div>
  </nav>
</header>

<div class="container">

  <h1>Contact Me</h1>

  <p>
    If you'd like to collaborate, ask questions, or discuss a project,
    feel free to reach out through the options below.
  </p>

  <!-- CONTACT OPTIONS -->
  <div class="contact-grid">

    <section class="contact-card">
      <button class="contact-toggle" type="button" aria-expanded="false" aria-controls="email-details">
        <span class="contact-title">Email</span>
        <span class="contact-hint">Click to reveal</span>
      </button>
      <div class="contact-details" id="email-details" hidden>
        <a href="mailto:charroovanmegen01@gmail.com">charroovanmegen01@gmail.com</a>
      </div>
    </section>

    <section class="contact-card">
      <button class="contact-toggle" type="button" aria-expanded="false" aria-controls="github-details">
        <span class="contact-title">GitHub</span>
        <span class="contact-hint">Click to reveal</span>
      </button>
      <div class="contact-details" id="github-details" hidden>
        <a href="https://github.com/charroo-van-megen" target="_blank" rel="noopener noreferrer">charroo-van-megen</a>
      </div>
    </section>

    <section class="contact-card">
      <button class="contact-toggle" type="button" aria-expanded="false" aria-controls="discord-details">
        <span class="contact-title">Discord</span>
        <span class="contact-hint">Click to reveal</span>
      </button>
      <div class="contact-details" id="discord-details" hidden>
        <a href="https://discord.com/users/kashikoi1478" target="_blank" rel="noopener noreferrer">kashikoi1478</a>
      </div>
    </section>

    <section class="contact-card">
      <button class="contact-toggle" type="button" aria-expanded="false" aria-controls="instagram-details">
        <span class="contact-title">Instagram</span>
        <span class="contact-hint">Click to reveal</span>
      </button>
      <div class="contact-details" id="instagram-details" hidden>
        <a href="https://www.instagram.com/C.W.van.Megen" target="_blank" rel="noopener noreferrer">@C.W.van.Megen</a>
      </div>
    </section>

  </div>

</div>

<script>
  document.querySelectorAll('.contact-toggle').forEach(button => {
    button.addEventListener('click', () => {
      const details = document.getElementById(button.getAttribute('aria-controls'));
      const expanded = button.getAttribute('aria-expanded') === 'true';

      button.setAttribute('aria-expanded', String(!expanded));
      button.querySelector('.contact-hint').textContent = expanded
        ? 'Click to reveal'
        : 'Click to hide';
      details.hidden = expanded;
    });
  });
</script>

<footer>
  <p>© 2026 Charroo van Megen</p>
</footer>

</body>
</html>
