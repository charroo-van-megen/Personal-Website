<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <nav class="navbar">
    <div class="logo">
      <a href="index.html">Charroo van Megen</a>
    </div>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="projects.html">Projects</a>
      <a href="about.html">About Me</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>
</header>

<div class="container">

  <h1>Contact Me</h1>

  <p>
    If you'd like to collaborate, ask questions, or discuss a project,
    feel free to reach out through the options below.
  </p>

  <!-- CONTACT CARDS (CLICKABLE) -->
  <div class="contact-grid">

    <div class="contact-card contact-item"
      data-title="Email"
      data-text="charroovanmegen01@gmail.com"
      data-link="mailto:charroovanmegen01@gmail.com">
      <h2>Email</h2>
    </div>

    <div class="contact-card contact-item"
      data-title="GitHub"
      data-text="charroo-van-megen"
      data-link="https://github.com/charroo-van-megen">
      <h2>GitHub</h2>
    </div>

    <div class="contact-card contact-item"
      data-title="Discord"
      data-text="kashikoi1478"
      data-link="https://discord.com/users/kashikoi1478">
      <h2>Discord</h2>
    </div>

    <div class="contact-card contact-item"
      data-title="Instagram"
      data-text="C.W.van.Megen"
      data-link="https://www.instagram.com/C.W.van.Megen">
      <h2>Instagram</h2>
    </div>

  </div>

</div>

<!-- MODAL -->
<div id="confirmModal" class="modal">
  <div class="modal-content">

    <h2 id="modalTitle"></h2>
    <p id="modalText"></p>

    <div class="modal-buttons">
      <button class="confirm" id="openLink">Open</button>
      <button class="cancel">Close</button>
    </div>

  </div>
</div>

<footer>
  <p>© 2026 Charroo van Megen</p>
</footer>

<script>
  const modal = document.getElementById('confirmModal');
  const titleEl = document.getElementById('modalTitle');
  const textEl = document.getElementById('modalText');
  const openBtn = document.getElementById('openLink');
  const cancelBtn = modal.querySelector('.cancel');

  let currentLink = '';

  // OPEN MODAL FROM CARD
  document.querySelectorAll('.contact-item').forEach(card => {
    card.addEventListener('click', () => {
      titleEl.textContent = card.dataset.title;
      textEl.textContent = card.dataset.text;
      currentLink = card.dataset.link;

      modal.style.display = 'block';
    });
  });

  // OPEN LINK
  openBtn.addEventListener('click', () => {
    if (currentLink) {
      window.open(currentLink, '_blank');
    }
    modal.style.display = 'none';
  });

  // CLOSE MODAL
  cancelBtn.addEventListener('click', () => {
    modal.style.display = 'none';
    currentLink = '';
  });

  // CLICK OUTSIDE MODAL
  window.addEventListener('click', (e) => {
    if (e.target === modal) {
      modal.style.display = 'none';
      currentLink = '';
    }
  });
</script>

</body>
</html>
